<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report Found Dog - Snout Scout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      body 
      {
        background-color: #ddead1 ; /* Very light green*/
        .btn-brand-pink {
    /* This is a nice "rose" pink */
    background-color: #ff66c4 ;  
    border-color: #ff66c4 ;
    color: white;
  }

  
  .btn-brand-pink:hover {
    background-color: #e91e63;
    border-color: #e91e63;
    color: white;
  }






        
      }
    </style>
  </head>
  <body>

    <div class="container my-5"> <div class="row">
        <div class="col-lg-10 mx-auto">
        
          <div class="card shadow-sm border-0" style="overflow: hidden; border-radius: 1rem;">
            <div class="row g-0"> <div class="col-md-6 p-4 p-md-5">
                <h2 class="h3 fw-bold mb-3">Report a Found Dog</h2>
                
                <form>
                  
                  <div class="mb-3">
                    <label for="bystandName" class="form-label">Your Name:</label>
                    <input type="text" class="form-control" id="bystandName" required>
                  </div>
                  
                  <div class="mb-3">
                    <label for="dogName" class="form-label">Dog’s Name (if known):</label>
                    <input type="text" class="form-control" id="dogName">
                  </div>
                  
                  <div class="mb-3">
                    <label for="dogBreed" class="form-label">Breed(Optional):</label>
                    <input type="text" class="form-control" id="dogBreed">
                  </div>

                  <div class="mb-3">
                    <label for="dogColor" class="form-label">Color(Optional):</label>
                    <input type="text" class="form-control" id="dogColor">
                  </div>
                  
                  <div class="mb-3">
                    <label for="lastPlace" class="form-label">City:</label>
                    <input type="text" class="form-control" id="lastPlace">
                  </div>

                  <div class="mb-3">
                    <label for="lastPlace" class="form-label">Metro Location:</label>
                    <input type="text" class="form-control" id="lastPlace">
                  </div>
                  
                  <div class="mb-3">
                    <label for="lastPlace" class="form-label">Last Seen Location:</label>
                    <input type="text" class="form-control" id="lastPlace">
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Your Email:</label>
                    <input type="email" class="form-control" id="email"> </div>

                  <div class="mb-3">
                    <label for="phoNum" class="form-label">Your Phone Number:</label>
                    <input type="tel" class="form-control" id="phoNum"> </div>

                  <div class="mb-3">
                    <label for="dogPic" class="form-label">Upload a Photo:</label>
                    <input type="file" class="form-control" id="dogPic" accept="image/*">
                  </div>

                  <div class="mb-3">
                    <label for="comments" class="form-label">Additional Comments:</label>
                    <textarea class="form-control" id="comments" rows="3"></textarea>
                  </div>


                  <div class="d-grid pt-3">
                    <button type="submit" class="btn btn-lg btn-brand-pink">Submit Report</button>
                  </div>
                  
                  <div class="text-center mt-3">
                    <a href="index.html" class="btn btn-outline-secondary btn-sm">← Back to Home</a>
                  </div>

                </form>
                
              </div> <div class="col-md-6 d-none d-md-block">
                <img src="Logo.png" 
                     alt="A happy dog" 
                     style="width: 100%; height: 100%; object-fit: contain;">
              </div>

              
              
            </div> </div> </div>
      </div>
    </div> </body>
</html>
