<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snout Scout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
    }

    /* Background image styling */
   .homepage {
      background-image: url('homepage.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      position: relative; /* needed for absolute positioning of children */
    }

    /* Button container with absolute positioning */
    .button-container {
      position: absolute; 
      left: 130px; /*from left*/
      top: 660px;  /*from top*/
      display: flex;
      gap: 50px;
    }

    /* Button style */
    .button-container button {
      background-color: white;
      border: 3px solid #66bb6a;
      border-radius: 50px;
      font-size: 22px;
      font-weight: bold;
      padding: 14px 45px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .button-container button:hover {
      background-color: #a5d6a7;
      transform: scale(1.05);
    }

    .topright-buttons{
       display: flex;
      justify-content: flex-end;
      gap: 25px;
      padding: 30px 60px; 
    }

    .topright-buttons button{
      background-color: transparent;
      color: rgb(0, 0, 0);
      border: 2px solid rgb(0, 0, 0);
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .topright-buttons button:hover{
      background-color: white;
      color: #000000;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .topright-buttons{
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        padding: 20px;
      }

      .topright-buttons button {
        font-size: 16px;
        padding: 8px 20px;
      }


      .button-container {
        flex-direction: column;
        gap: 20px;
      }

      .button-container button {
        width: 200px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="homepage">
    <div class = "topright-buttons">
      <button onclick="window.location.href='flyers.html'">Flyers</button>
      <button onclick="window.location.href='media.html'">Media</button>
      <button onclick="window.location.href='about.html'">About</button>
    </div>
    <div class="button-container">
      <button onclick="window.location.href='reportform.html'">Lost</button>
      <button onclick="window.location.href='foundform.html'">Found</button>
    </div>
  </div>

</body>
</html>
